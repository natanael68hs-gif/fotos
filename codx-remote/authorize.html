<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorizar PC — Codx Remote</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/webp" href="/codx-remote-icon.webp"></head><body>
<header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/codx-remote-icon.webp" alt="Codx Remote"><span>Codx Remote</span></a></header>
<main class="auth-shell"><form class="auth-card reveal" id="authorizeForm"><span class="badge"><span class="dot"></span> PC DETECTADO</span><h1>Autorize este computador</h1><p>O agente já está rodando. Crie sua conta Codx Remote para vincular este PC e continuar.</p><div class="field"><label>Nome</label><input id="name" autocomplete="name" required></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="form-msg" id="msg"></div><button class="btn" style="width:100%" type="submit">Autorizar e abrir Dashboard</button><div class="auth-links">Essa autorização vale somente para o dispositivo que iniciou o fluxo.</div></form></main>
<script src="/app.js"></script><script src="/auth.js"></script></body></html>
