services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: "/data"
      PUBLIC_BASE_URL: "https://${DOMAIN}"
    volumes:
      - codx_data:/data
    networks:
      - codx

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay
    networks:
      - codx

networks:
  codx:

volumes:
  codx_data:
  caddy_data:
  caddy_config:
