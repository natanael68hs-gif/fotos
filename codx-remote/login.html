<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Codx Remote</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/webp" href="/codx-remote-icon.webp"></head><body>
<header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/codx-remote-icon.webp" alt="Codx Remote"><span>Codx Remote</span></a><nav class="navlinks"><a href="/install">Install</a><a href="/register">Criar conta</a></nav></header>
<main class="auth-shell"><form class="auth-card reveal" id="loginForm"><img class="brand-logo" src="/codx-remote-icon.webp" alt="Codx Remote"><h1>Entrar no Codx Remote</h1><p>Acesse seus computadores, uso e conexões.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><div class="form-msg" id="msg"></div><button class="btn" style="width:100%" type="submit">Entrar</button><div class="auth-links">Ainda não tem conta? <a href="/register">Criar conta</a></div></form></main>
<script src="/app.js"></script><script src="/auth.js"></script></body></html>
