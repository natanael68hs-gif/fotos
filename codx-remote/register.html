<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro — Codx Remote</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/webp" href="/codx-remote-icon.webp"></head><body>
<header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/codx-remote-icon.webp" alt="Codx Remote"><span>Codx Remote</span></a><nav class="navlinks"><a href="/install">Install</a><a href="/login">Entrar</a></nav></header>
<main class="auth-shell"><form class="auth-card reveal" id="registerForm"><img class="brand-logo" src="/codx-remote-icon.webp" alt="Codx Remote"><h1>Criar conta</h1><p>Uma conta controla seus dispositivos Codx Remote e o limite de uso.</p><div class="field"><label>Nome</label><input id="name" autocomplete="name" required></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="form-msg" id="msg"></div><button class="btn" style="width:100%" type="submit">Criar conta</button><div class="auth-links">Já tem conta? <a href="/login">Entrar</a></div></form></main>
<script src="/app.js"></script><script src="/auth.js"></script></body></html>
