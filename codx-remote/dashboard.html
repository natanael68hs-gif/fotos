<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Codx Remote</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/webp" href="/codx-remote-icon.webp"></head><body>
<header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/codx-remote-icon.webp" alt="Codx Remote"><span>Codx Remote</span></a><nav class="navlinks"><a href="/install">Install</a><button class="btn ghost small" id="logoutBtn">Sair</button></nav></header>
<main class="wrap dashboard"><div class="dash-head"><div><div class="eyebrow">DASHBOARD</div><h1 id="hello">Codx Remote</h1><p class="lead" id="accountLine">Carregando sua conta...</p></div><a class="btn" href="/install">+ Conectar PC</a></div>
<div class="dash-grid"><section class="metric-card reveal"><div class="metric-label">Uso mensal</div><div class="metric-value"><span id="used">0</span> / <span id="limit">500</span></div><div class="usage-bar"><i id="usageFill"></i></div><p class="lead" style="font-size:14px">Chamadas MCP contabilizadas neste mês.</p></section><section class="metric-card reveal"><div class="metric-label">Plano atual</div><div class="metric-value" id="plan">Free</div><p class="lead" style="font-size:14px">Total histórico: <b id="total">0</b> chamadas.</p></section></div>
<section class="section" style="padding-top:50px"><div class="eyebrow">DISPOSITIVOS</div><h2>Seus computadores</h2><p class="lead">Enquanto o PowerShell estiver aberto, o dispositivo aparece como online.</p><div class="device-list" id="deviceList"></div></section></main>
<script src="/app.js"></script><script src="/dashboard.js"></script></body></html>
