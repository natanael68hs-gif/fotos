services:
  - type: web
    name: codx-remote-api-zrider
    runtime: node
    plan: free
    rootDir: codx-remote/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_SITE_URL
        value: https://codx-remote-zrider.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: codx-remote-db-zrider
          property: connectionString

databases:
  - name: codx-remote-db-zrider
    plan: free
    databaseName: codxremote
    user: codxremote
