<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Teste ZRider</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#1f2937);color:#fff}
    .card{width:min(92%,680px);padding:48px;border-radius:24px;background:rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;border:1px solid rgba(255,255,255,.12)}
    h1{font-size:clamp(32px,7vw,64px);margin:0 0 14px}p{font-size:20px;opacity:.85;margin:0}.ok{display:inline-block;margin-top:24px;padding:10px 16px;border-radius:999px;background:#22c55e;color:#062b12;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>ZRider 🚀</h1>
    <p>Site criado no GitHub e publicado no Vercel.</p>
    <span class="ok">Deploy funcionando</span>
  </main>
</body>
</html>
